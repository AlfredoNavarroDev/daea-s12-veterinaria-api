name: Build, publish and deploy to MonsterASP.NET

on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Lab12/Lab12.csproj

      - name: Build
        run: dotnet build Lab12/Lab12.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Lab12/Lab12.csproj --configuration Release --output ./publish --runtime win-x86 --self-contained false

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
